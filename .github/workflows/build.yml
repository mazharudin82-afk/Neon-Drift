name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug and extract
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== Finding zip ==="
          find . -name "*.zip" 2>/dev/null
          echo "=== Extracting ==="
          find . -name "NeonDrift.zip" -exec unzip -q {} \;
          echo "=== After extract ==="
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        shell: bash
        run: |
          cd NeonDrift
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          find . -name "build.log" -exec grep -E '^e:' {} \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: NeonDrift-apk
          path: NeonDrift/app/build/outputs/apk/debug/app-debug.apk
